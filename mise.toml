[settings]
lockfile = true
minimum_release_age = "3d"

[tools]
"cargo:cargo-edit" = { version = "0.13.13", default-features = false, features = "upgrade" }
"github:kjanat/actionlint" = "1.13.0"
"npm:actions-up" = "1.18.0"
buf = "1.72.0"
node = "26.7.0"
rust = { version = "1.97.1", components = "rust-analyzer,rust-src,rustfmt,clippy" }

[tasks.build]
description = "Build every contract crate"
run = "cargo build --locked --workspace --all-features"

[tasks.format]
description = "Format Rust and Protobuf sources"
run = [{ tasks = ["crates:format", "proto:format"] }]

[tasks."crates:format"]
description = "Format contract crate sources"
run = "cargo fmt --all"

[tasks."proto:format"]
description = "Format Protobuf sources"
run = "buf format -w"

[tasks.check]
description = "Check workflows, contract crates, and Protobuf sources"
run = [{ tasks = ["workflows:check", "crates:check", "proto:check"] }]

[tasks."workflows:check"]
description = "Check GitHub Actions workflows"
run = "actionlint"

[tasks."crates:check"]
description = "Check contract crate formatting and lints"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
]

[tasks."proto:check"]
description = "Check Protobuf formatting and style"
run = ["buf lint", "buf format --diff --exit-code"]

[tasks.test]
description = "Run every contract test"
run = "cargo test --locked --workspace --all-features"

[tasks.update]
description = "Update the toolchain, workflows, and contract dependencies"
run = [
  { task = "toolchain:update" },
  { tasks = [
    "workflows:update",
    "crates:update",
  ] },
]

[tasks."workflows:update"]
description = "Update and SHA-pin GitHub Actions dependencies"
run = "actions-up --yes"

[tasks."crates:update"]
description = "Update contract crate dependencies"
run = "cargo upgrade --incompatible allow --pinned allow"

[tasks."toolchain:update"]
description = "Update mise-managed tools"
run = "mise upgrade --bump"
